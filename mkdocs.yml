site_name: Ethan Carter Security Writeups
site_description: CTF challenges, exploit development, and security research writeups
site_author: Your Name
site_url: https://example.com/

repo_name: yourusername/writeups
repo_url: https://github.com/yourusername/writeups

copyright: Copyright &copy; 2026 Your Name

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/shield-lock
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  # Code blocks and syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Callouts / admonitions (great for tips, warnings, flags)
  - admonition
  - pymdownx.details
  # Tabbed content (e.g. multiple exploit approaches)
  - pymdownx.tabbed:
      alternate_style: true
  # Misc formatting
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - tables
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/yourusername
    - icon: fontawesome/solid/paper-plane
      link: mailto:you@example.com
  tags:
    Web: web
    Pwn: pwn
    Crypto: crypto
    Reverse Engineering: rev
    Forensics: forensics
    Networking: net

